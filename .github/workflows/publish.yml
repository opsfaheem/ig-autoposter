name: Publish Instagram posts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no posting)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish due posts
        run: python publisher.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Commit queue updates
        if: always()
        run: |
          git config user.name "ig-autoposter"
          git config user.email "ig-autoposter@users.noreply.github.com"
          git add queue.csv
          git diff --cached --quiet || (git commit -m "Update queue [skip ci]" && git push)
